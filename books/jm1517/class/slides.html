<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JM15 + JM17 intensive class</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1c1c1c; color: #f4f4f4; font-family: "Segoe UI", Calibri, sans-serif; }
  body { display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px; background: #111; flex: none;
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 650; white-space: nowrap; }
  header .name { opacity: 0.85; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .count { margin-left: auto; font-variant-numeric: tabular-nums; opacity: 0.8; white-space: nowrap; }
  button {
    font: inherit; color: inherit; background: #2a2a2a; border: 0;
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { background: #3a3a3a; }
  main { flex: 1; min-height: 0; display: grid; place-items: center; padding: 12px; }
  .stage {
    width: min(100%, calc((100vh - 120px) * 16 / 9));
    aspect-ratio: 16 / 9;
    background: #000; border-radius: 4px; overflow: hidden;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
  }
  .stage:fullscreen { width: 100vw; height: 100vh; aspect-ratio: auto; border-radius: 0; }
  .stage:-webkit-full-screen { width: 100vw; height: 100vh; border-radius: 0; }
  .stage iframe { display: block; width: 100%; height: 100%; border: 0; background: #000; }
  .stage { position: relative; }
  #ink { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; touch-action: none; }
  .stage.pointer #ink, .stage.pen #ink { pointer-events: auto; }
  .stage.pointer #ink { cursor: none; }
  .stage.pen #ink { cursor: crosshair; }
  #dot {
    position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, #fff 0 18%, #ff3030 30% 55%, rgba(255, 48, 48, 0) 72%);
    box-shadow: 0 0 14px 6px rgba(255, 40, 40, 0.55); display: none;
  }
  .tools {
    position: absolute; left: 10px; bottom: 10px; display: flex; gap: 4px; align-items: center;
    padding: 4px; border-radius: 10px; background: rgba(20, 20, 20, 0.78); opacity: 0.35; transition: opacity 0.2s;
  }
  .tools:hover, .stage.pen .tools, .stage.pointer .tools, .stage.menu .tools { opacity: 1; }
  #menu {
    position: absolute; left: 10px; bottom: 54px; max-height: calc(100% - 70px); overflow-y: auto;
    display: grid; grid-template-columns: repeat(2, auto); gap: 2px 8px; padding: 6px;
    border-radius: 10px; background: rgba(20, 20, 20, 0.94); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
  }
  #menu[hidden] { display: none; }
  #menu h3 { grid-column: 1 / -1; margin: 6px 8px 2px; font-size: 11px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.6; }
  #menu button { text-align: left; white-space: nowrap; padding: 5px 10px; font-size: 13px; background: transparent; }
  #menu button:hover { background: #3a3a3a; }
  #menu button.on { background: #e0a020; color: #111; }
  #menu button span { display: inline-block; min-width: 2.2em; opacity: 0.55; font-variant-numeric: tabular-nums; }
  .tools button { padding: 4px 9px; font-size: 13px; }
  .tools button.on { background: #e0a020; color: #111; }
  .tools .swatch { width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 2px solid transparent; }
  .tools .swatch.on { border-color: #fff; background-clip: padding-box; }
  footer {
    flex: none; display: flex; gap: 6px; overflow-x: auto;
    padding: 8px 12px 12px; background: #111;
  }
  footer button {
    flex: none; width: 92px; padding: 0; background: transparent; border-radius: 4px;
    outline: 2px solid transparent;
  }
  footer button.on { outline-color: #e0a020; }
  footer img { display: block; width: 100%; height: 52px; object-fit: cover; background: #000; border-radius: 3px; }
</style>
</head>
<body>
<header>
  <a href="../../../index.html" title="Back to the library" style="color: inherit; background: #2a2a2a; border-radius: 8px; padding: 6px 12px; text-decoration: none;">Library</a>
  <button type="button" id="prev" title="Previous step (←)">‹</button>
  <button type="button" id="next" title="Next step (→ or space)">›</button>
  <h1>JM15 + JM17 intensive class</h1>
  <span class="name" id="name"></span>
  <span class="count" id="count"></span>
  <button type="button" id="full" title="Full screen (F)">Full screen</button>
</header>
<main><div class="stage" id="stage">
  <iframe id="deck" title="JM15 + JM17 intensive class" allow="autoplay; fullscreen" allowfullscreen></iframe>
  <canvas id="ink"></canvas>
  <div id="dot"></div>
  <div id="menu" hidden></div>
  <div class="tools" id="tools">
    <button type="button" id="jump" title="Jump to a question (Q)">Questions</button>
    <button type="button" id="pointer" title="Laser pointer (P)">Pointer</button>
    <button type="button" id="pen" title="Pen (D)">Pen</button>
    <button type="button" class="swatch on" data-color="#ffd400" style="background:#ffd400" title="Yellow"></button>
    <button type="button" class="swatch" data-color="#ff4d4d" style="background:#ff4d4d" title="Red"></button>
    <button type="button" class="swatch" data-color="#4dd0ff" style="background:#4dd0ff" title="Blue"></button>
    <button type="button" class="swatch" data-color="#ffffff" style="background:#ffffff" title="White"></button>
    <button type="button" id="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button type="button" id="clear" title="Clear this slide's ink (C)">Clear</button>
  </div>
</div></main>
<footer id="strip"></footer>
<script>
const TITLES = [
  "Title",
  "Outline",
  "Properties of congruent figures",
  "Prove of congruent triangles",
  "MC question 4",
  "MC question 10",
  "MC question 13",
  "Short question 14 (a)",
  "Short question 14 (b)",
  "Short question 15 (a)",
  "Short question 15 (b)",
  "Short question 17",
  "Practice: congruence",
  "Properties of similar figures",
  "Prove of similar triangles",
  "MC question 25",
  "Short question 29 (a)",
  "Short question 29 (b)",
  "Short question 35 (a)",
  "Short question 35 (b)",
  "Short question 41 (a)",
  "Short question 41 (b)",
  "Short question 41 (c)",
  "MC question 45",
  "Practice: similarity",
  "Summary",
];
const frame = document.getElementById("deck");
const stage = document.getElementById("stage");
const name = document.getElementById("name");
const count = document.getElementById("count");
const strip = document.getElementById("strip");
let reveal = null;
// First deck step of each slide, and its step count, read from the deck's speaker notes ("Slide 6/27: ...").
let starts = [];
let steps = [];

function fromHash() {
  const [s, k] = location.hash.slice(1).split(".");
  const slide = Math.max(1, Math.min(TITLES.length, parseInt(s, 10) || 1)) - 1;
  return { slide, step: Math.max(0, parseInt(k, 10) || 0) };
}

const buttons = TITLES.map((title, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.title = `${i + 1}. ${title}`;
  const img = document.createElement("img");
  img.src = `thumbs/S${String(i + 1).padStart(2, "0")}.jpg`;
  img.alt = title;
  img.loading = "lazy";
  b.append(img);
  b.addEventListener("click", () => go(i, 0));
  strip.append(b);
  return b;
});

// ---- Question menu: every slide by title, grouped by topic; it sits in the stage, so it works in full screen.
const menu = document.getElementById("menu");
const PARTS = [["Congruence", 0], ["Similarity", 13]];
const items = TITLES.map((title, i) => {
  const part = PARTS.find(([, first]) => first === i);
  if (part) {
    const h = document.createElement("h3");
    h.textContent = part[0];
    menu.append(h);
  }
  const b = document.createElement("button");
  b.type = "button";
  const n = document.createElement("span");
  n.textContent = i + 1;
  b.append(n, title);
  b.addEventListener("click", () => { showMenu(false); go(i, 0); frame.focus(); });
  menu.append(b);
  return b;
});

function showMenu(open = menu.hidden) {
  menu.hidden = !open;
  stage.classList.toggle("menu", open);
  document.getElementById("jump").classList.toggle("on", open);
  if (open) items[current].scrollIntoView({ block: "nearest" });
}
document.getElementById("jump").addEventListener("click", () => showMenu());
const closeMenu = (e) => { if (!menu.hidden && !e.target.closest?.("#menu, #jump")) showMenu(false); };
document.addEventListener("pointerdown", closeMenu);

function go(slide, step) {
  if (!reveal) return;
  slide = Math.max(0, Math.min(TITLES.length - 1, slide));
  reveal.slide(starts[slide] + Math.min(step, steps[slide] - 1));
}

function sync() {
  const h = reveal.getIndices().h;
  let slide = 0;
  while (slide + 1 < starts.length && starts[slide + 1] <= h) slide++;
  const step = h - starts[slide];
  if (slide !== current) { current = slide; drawInk(); }
  name.textContent = TITLES[slide];
  count.textContent = `Slide ${slide + 1} / ${TITLES.length} · step ${step + 1} / ${steps[slide]}`;
  buttons.forEach((b, i) => b.classList.toggle("on", i === slide));
  items.forEach((b, i) => b.classList.toggle("on", i === slide));
  buttons[slide].scrollIntoView({ inline: "center", block: "nearest" });
  history.replaceState(null, "", step ? `#${slide + 1}.${step}` : `#${slide + 1}`);
}

frame.addEventListener("load", () => {
  const w = frame.contentWindow;
  const ready = () => {
    reveal = w.Reveal;
    starts = [];
    steps = [];
    w.document.querySelectorAll(".slides > section").forEach((section, h) => {
      const n = /Slide (\d+)\//.exec(section.querySelector("aside.notes")?.textContent || "");
      if (!n) return;
      const i = Number(n[1]) - 1;
      if (starts[i] === undefined) { starts[i] = h; steps[i] = 0; }
      steps[i]++;
    });
    reveal.on("slidechanged", sync);
    w.document.addEventListener("keydown", toolKeys, true);
    w.document.addEventListener("pointerdown", closeMenu, true);
    const { slide, step } = fromHash();
    go(slide, step);
    sync();
  };
  if (w.Reveal.isReady()) ready(); else w.Reveal.on("ready", ready);
});
frame.src = "deck/index.html";

function full() {
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    (stage.requestFullscreen || stage.webkitRequestFullscreen).call(stage);
  }
}

// ---- Laser pointer and pen, drawn over the deck (also in full screen). Ink is kept per slide, in memory only.
const ink = document.getElementById("ink");
const dot = document.getElementById("dot");
const ctx = ink.getContext("2d");
let current = 0;
let mode = "";
let color = "#ffd400";
let penSeen = false;
const strokes = {};
let live = null;

// The deck letterboxes its 16:9 slide inside the stage; ink is stored in that slide's 0..1 coordinates.
function slideRect() {
  const w = ink.clientWidth, h = ink.clientHeight;
  const sw = Math.min(w, h * 16 / 9), sh = sw * 9 / 16;
  return { x: (w - sw) / 2, y: (h - sh) / 2, w: sw, h: sh };
}

function drawInk() {
  const dpr = devicePixelRatio || 1;
  if (ink.width !== Math.round(ink.clientWidth * dpr) || ink.height !== Math.round(ink.clientHeight * dpr)) {
    ink.width = Math.round(ink.clientWidth * dpr);
    ink.height = Math.round(ink.clientHeight * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, ink.clientWidth, ink.clientHeight);
  const r = slideRect();
  ctx.lineCap = ctx.lineJoin = "round";
  for (const s of strokes[current] || []) {
    ctx.strokeStyle = s.color;
    const pts = s.pts.map(([x, y, p]) => [r.x + x * r.w, r.y + y * r.h, p]);
    for (let i = 1; i < pts.length; i++) {
      const [x0, y0] = pts[i - 1], [x1, y1, p] = pts[i];
      ctx.lineWidth = r.w * 0.0032 * (0.5 + p);
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.stroke();
    }
    if (pts.length === 1) {
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(pts[0][0], pts[0][1], r.w * 0.0024, 0, 2 * Math.PI);
      ctx.fill();
    }
  }
}

function setMode(m) {
  mode = mode === m ? "" : m;
  stage.classList.toggle("pointer", mode === "pointer");
  stage.classList.toggle("pen", mode === "pen");
  document.getElementById("pointer").classList.toggle("on", mode === "pointer");
  document.getElementById("pen").classList.toggle("on", mode === "pen");
  dot.style.display = "none";
  if (!mode) frame.focus();
}

function at(e) {
  const b = ink.getBoundingClientRect(), r = slideRect();
  return [(e.clientX - b.left - r.x) / r.w, (e.clientY - b.top - r.y) / r.h, e.pressure > 0 && e.pointerType === "pen" ? e.pressure : 0.5];
}

ink.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "pen") penSeen = true;
  if (mode !== "pen" || (e.pointerType === "touch" && penSeen)) return;
  e.preventDefault();
  try { ink.setPointerCapture(e.pointerId); } catch { /* pointer already gone */ }
  live = { id: e.pointerId, stroke: { color, pts: [at(e)] } };
  (strokes[current] ||= []).push(live.stroke);
  drawInk();
});
ink.addEventListener("pointermove", (e) => {
  if (mode === "pointer") {
    const b = ink.getBoundingClientRect();
    dot.style.left = `${e.clientX - b.left}px`;
    dot.style.top = `${e.clientY - b.top}px`;
    dot.style.display = "block";
    return;
  }
  if (!live || e.pointerId !== live.id) return;
  const batch = e.getCoalescedEvents?.();
  for (const ev of batch?.length ? batch : [e]) live.stroke.pts.push(at(ev));
  drawInk();
});
const end = (e) => { if (live && e.pointerId === live.id) live = null; };
ink.addEventListener("pointerup", end);
ink.addEventListener("pointercancel", end);
ink.addEventListener("pointerleave", () => { dot.style.display = "none"; });
addEventListener("resize", drawInk);
document.addEventListener("fullscreenchange", () => requestAnimationFrame(drawInk));
document.addEventListener("webkitfullscreenchange", () => requestAnimationFrame(drawInk));

document.getElementById("pointer").addEventListener("click", () => setMode("pointer"));
document.getElementById("pen").addEventListener("click", () => setMode("pen"));
document.getElementById("undo").addEventListener("click", () => { strokes[current]?.pop(); drawInk(); });
document.getElementById("clear").addEventListener("click", () => { strokes[current] = []; drawInk(); });
document.querySelectorAll(".tools .swatch").forEach((b) => b.addEventListener("click", () => {
  color = b.dataset.color;
  document.querySelectorAll(".tools .swatch").forEach((x) => x.classList.toggle("on", x === b));
  if (mode !== "pen") setMode("pen");
}));

// Also runs first inside the deck, where Reveal would otherwise take P as "previous".
function toolKeys(e) {
  const k = e.key.toLowerCase();
  let used = true;
  if ((e.ctrlKey || e.metaKey) && k === "z") { strokes[current]?.pop(); drawInk(); }
  else if (e.ctrlKey || e.metaKey || e.altKey) used = false;
  else if (k === "p") setMode("pointer");
  else if (k === "d") setMode("pen");
  else if (k === "c") { strokes[current] = []; drawInk(); }
  else if (k === "q") showMenu();
  else if (k === "escape" && !menu.hidden) showMenu(false);
  else if (k === "escape" && mode) setMode(mode);
  else used = false;
  if (used) { e.preventDefault(); e.stopImmediatePropagation(); }
}
document.addEventListener("keydown", toolKeys);

document.getElementById("prev").addEventListener("click", () => reveal?.prev());
document.getElementById("next").addEventListener("click", () => reveal?.next());
document.getElementById("full").addEventListener("click", full);
document.addEventListener("keydown", (e) => {
  if (!reveal) return;
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); reveal.next(); }
  if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); reveal.prev(); }
  if (e.key === "Home") go(0, 0);
  if (e.key === "End") go(TITLES.length - 1, 0);
  if (e.key === "f" || e.key === "F") full();
});
addEventListener("hashchange", () => { const { slide, step } = fromHash(); go(slide, step); });
</script>
</body>
</html>
